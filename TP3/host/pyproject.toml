[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tp3-riscv-tui"
version = "0.1.0"
description = "UART lab console for the TP3 ADD-only pipeline"
requires-python = ">=3.10"
dependencies = ["textual>=1.0,<9", "pyserial>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
riscv-tui = "riscv_tui.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["riscv_tui*"]
